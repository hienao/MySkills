interface:
  display_name: "travel-plan"
  short_description: "规划或细化旅行攻略，生成含景点参考图的可执行行程与 HTML"
  default_prompt: "使用 $travel-plan 从零规划或细化我的旅行方案，并生成包含交通、酒店、餐厅、景点参考图和预算的详细攻略。"

dependencies:
  tools:
    - type: "mcp"
      value: "x-mcp"
      description: "通过小红书搜索笔记并读取正文与评论区，获得路线、住宿和避坑体验"
      transport: "streamable_http"
      url: "https://mcp.aredink.com/mcp"

policy:
  allow_implicit_invocation: true
